:root{--blue:#3189D0;--blue-d:#1465A5;--blue-l:#EAF6FE;--org:#FF8A1F;--org2:#FFB547;--ink:#1d2b3a;--mut:#6b7a8c;--line:#e3ecf5;--r:22px;--sh:0 6px 22px rgba(20,101,165,.10),0 1px 3px rgba(20,101,165,.08);
--l0:#3189D0;--l0b:#e3f1fc;--l1:#22a55b;--l1b:#def7e7;--l2:#f08a12;--l2b:#fff0dc;--l3:#e5484d;--l3b:#ffe8e8;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Sarabun","TH Sarabun New","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;
background:#fff linear-gradient(180deg,#e9f5fe 0,#f6fbff 260px,#fff 520px) no-repeat;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.sim{position:sticky;top:0;z-index:60;background:repeating-linear-gradient(45deg,#fff1f1,#fff1f1 10px,#ffe2e2 10px,#ffe2e2 20px);color:#b42318;
font-weight:700;text-align:center;font-size:13.5px;padding:5px 10px;border-bottom:1px solid #ffc9c9}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
body.wide .wrap{max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.topbar h1{font-size:19px;margin:0;flex:1;line-height:1.3}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card.blue{background:var(--blue-l);box-shadow:none}
.card.org{background:linear-gradient(135deg,#ff9a2e 0%,#ffb547 100%);color:#fff}
.card h2{font-size:18px;margin:0 0 8px}
.card h3{font-size:16px;margin:0 0 6px}
.mut{color:var(--mut)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.row.wrapx{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16.5px;background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(49,137,208,.3);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#fff;color:var(--blue-d);box-shadow:inset 0 0 0 2px #cfe5f7}
.btn.light{background:var(--blue-l);color:var(--blue-d);box-shadow:none}
.btn.white{background:#fff;color:#e8730c;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn.green{background:#22a55b;box-shadow:0 4px 12px rgba(34,165,91,.3)}
.btn.red{background:#e5484d}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px}
.btn[disabled]{background:#c9d6e2;color:#fff;box-shadow:none;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.lv0{background:var(--l0b);color:var(--l0)}.lv1{background:var(--l1b);color:var(--l1)}.lv2{background:var(--l2b);color:var(--l2)}.lv3{background:var(--l3b);color:var(--l3)}
.b0{background:#eef1f4;color:#7b8794}.b1{background:#ffe8e8;color:#d93036}.b2{background:#fff4d6;color:#b77900}.b3{background:#def7e7;color:#178a49}
.bar{height:10px;background:#e6eef6;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.org>i{background:linear-gradient(90deg,#ff8a1f,#ffb547)}.bar.w{background:rgba(255,255,255,.35)}.bar.w>i{background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--blue-l);border-radius:16px;padding:10px;text-align:center}
.tile b{display:block;font-size:20px}
/* select screen */
.hero{text-align:center;padding:10px 0 4px}
.hero h1{font-size:24px;margin:6px 0 0;color:var(--blue-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #d6e7f5;font-weight:700;color:var(--blue-d)}
.chip.on{background:var(--blue);color:#fff;box-shadow:none}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:4px}
.stu button{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px;text-align:left;min-height:56px;font-size:14.5px}
.stu button b{display:block;color:var(--blue-d)}
/* roadmap */
.unit{position:relative;display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:0 0 14px 34px}
.unit:before{content:"";position:absolute;left:-22px;top:-14px;bottom:-14px;width:4px;background:#d6e7f5}
.unit:first-child:before{top:50%}.unit:last-child:before{bottom:50%}
.unit .dot{position:absolute;left:-33px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--blue);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-d)}
.unit.lock{background:#f4f7fa;box-shadow:none;color:#98a6b5}.unit.lock .dot{border-color:#c5d2de}
.unit.done .dot{background:var(--blue);color:#fff}
.stars{color:#ffb547;letter-spacing:1px;font-size:15px}.stars .off{color:#d7e1ea}
.chap{display:flex;gap:12px;align-items:center;cursor:pointer}
.chapno{width:52px;height:52px;border-radius:16px;background:var(--blue-l);color:var(--blue-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.qcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.qtext{font-size:18.5px;font-weight:700;line-height:1.6;margin:10px 0 4px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 2px #dbe8f3;padding:14px 16px;margin:0 0 10px;min-height:56px;font-size:16.5px;line-height:1.5}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:700;display:flex;align-items:center;justify-content:center}
.choice.sel{box-shadow:inset 0 0 0 3px var(--blue);background:#f3f9ff}.choice.sel .k{background:var(--blue);color:#fff}
.choice.ok{box-shadow:inset 0 0 0 3px #22a55b;background:#effbf3}.choice.ok .k{background:#22a55b;color:#fff}
.choice.bad{box-shadow:inset 0 0 0 3px #e5484d;background:#fff3f3}.choice.bad .k{background:#e5484d;color:#fff}
.choice[disabled]{cursor:default}
.unsure{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #e4d7c2;color:#9a6a12;font-weight:700}
.unsure.on{background:#fff4d6;box-shadow:inset 0 0 0 2px #f2a516}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);box-shadow:0 -4px 18px rgba(20,101,165,.10);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.fb{border-radius:18px;padding:14px 16px;margin:4px 0 12px;font-weight:700}
.fb.ok{background:#def7e7;color:#178a49}.fb.bad{background:#ffe8e8;color:#c22a2f}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(14,33,54,.42);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .2s ease-out}
.sheet.center{border-radius:26px;margin:auto;max-width:720px;max-height:90vh}
.scrim.mid{align-items:center;padding:16px}
.grab{width:46px;height:5px;border-radius:9px;background:#d5dee7;margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{position:relative;padding:8px 0 8px 40px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.55}
.bub.ai{background:var(--blue-l);border-top-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--blue);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtns button{background:#fff;box-shadow:inset 0 0 0 2px #cfe5f7;color:var(--blue-d);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14.5px}

terId": "EN-C1", "chapter": "บทที่ 1 Vocabulary คำศัพท์", "topicId": "EN-1.1", "topic": "1.1 คำศัพท์ในชีวิตประจำวัน", "level": 3, "levelName": "ยาก", "question": "Choose the word that completes both sentences: ‘I can ______ the ball.’ / ‘A ______ is an animal that can fly at night.’", "choices": ["bat", "owl", "kick", "cat"], "answer": 0, "hint": "คำเดียวกันแต่มีสองความหมาย", "explanation": ["bat = ไม้ตีลูกบอล / ตีด้วยไม้", "bat ยังหมายถึงค้างคาว สัตว์ที่บินตอนกลางคืน"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-1.1-L3-03", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C1", "chapter": "บทที่ 1 Vocabulary คำศัพท์", "topicId": "EN-1.1", "topic": "1.1 คำศัพท์ในชีวิตประจำวัน", "level": 3, "levelName": "ยาก", "question": "‘The museum is closed on Mondays.’ This means ______.", "choices": ["it opens only on Monday", "it is a new museum", "it is near your home", "you cannot visit it on Monday"], "answer": 3, "hint": "closed = ปิด", "explanation": ["พิพิธภัณฑ์ปิดทุกวันจันทร์", "จึงเข้าชมวันจันทร์ไม่ได้"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-1.1-L3-04", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C1", "chapter": "บทที่ 1 Vocabulary คำศัพท์", "topicId": "EN-1.1", "topic": "1.1 คำศัพท์ในชีวิตประจำวัน", "level": 3, "levelName": "ยาก", "question": "‘Nok's grandmother is her father's mother. Nok's father is Nok's grandmother's ______.’", "choices": ["daughter", "son", "nephew", "uncle"], "answer": 1, "hint": "คุณย่าเป็นแม่ของพ่อ", "explanation": ["พ่อของน้องนกเป็นลูกชายของคุณย่า", "ลูกชาย = son"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-1.1-L3-05", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C1", "chapter": "บทที่ 1 Vocabulary คำศัพท์", "topicId": "EN-1.1", "topic": "1.1 คำศัพท์ในชีวิตประจำวัน", "level": 3, "levelName": "ยาก", "question": "Which word has the OPPOSITE meaning of ‘difficult’?", "choices": ["hard", "dangerous", "easy", "heavy"], "answer": 2, "hint": "difficult = ยาก", "explanation": ["คำตรงข้ามของยากคือง่าย", "easy = ง่าย ส่วน hard = ยาก/แข็ง"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L0-01", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 0, "levelName": "ตั้งไข่", "question": "She ______ to school every day.", "choices": ["walks", "walk", "are walk", "walking"], "answer": 0, "hint": "every day = ทำเป็นประจำ ประธาน She", "explanation": ["Present simple กับ he/she/it เติม s", "She walks to school every day."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L0-02", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 0, "levelName": "ตั้งไข่", "question": "I ______ a student.", "choices": ["be", "am", "are", "is"], "answer": 1, "hint": "I ใช้กับ verb to be ตัวใด", "explanation": ["I + am", "I am a student."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L0-03", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 0, "levelName": "ตั้งไข่", "question": "They ______ football now.", "choices": ["are playing", "is playing", "plays", "played"], "answer": 0, "hint": "now = ตอนนี้ กำลังทำ", "explanation": ["Present continuous: are + V-ing กับ They", "They are playing football now."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L0-04", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 0, "levelName": "ตั้งไข่", "question": "Yesterday, we ______ to the zoo.", "choices": ["going", "went", "goes", "go"], "answer": 1, "hint": "yesterday = เมื่อวาน (อดีต)", "explanation": ["ใช้ Past simple: go → went", "We went to the zoo yesterday."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L0-05", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 0, "levelName": "ตั้งไข่", "question": "My cat ______ milk every morning.", "choices": ["are drinking", "drinks", "drinking", "drink"], "answer": 1, "hint": "ประธานเป็นเอกพจน์ (My cat)", "explanation": ["Present simple เติม s", "My cat drinks milk every morning."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L1-01", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 1, "levelName": "ง่าย", "question": "Look! The baby ______.", "choices": ["sleep", "is sleeping", "sleeping", "are sleeping"], "answer": 1, "hint": "Look! บอกว่าเกิดขึ้นตอนนี้", "explanation": ["ใช้ Present continuous", "is + sleeping"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L1-02", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 1, "levelName": "ง่าย", "question": "______ you finish your homework last night?", "choices": ["Are", "Did", "Do", "Does"], "answer": 1, "hint": "last night = อดีต", "explanation": ["คำถาม Past simple ใช้ Did", "Did you finish your homework last night?"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L1-03", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 1, "levelName": "ง่าย", "question": "Tomorrow I ______ my grandparents.", "choices": ["visits", "visited", "will visit", "am visit"], "answer": 2, "hint": "tomorrow = อนาคต", "explanation": ["ใช้ will + V1", "I will visit my grandparents tomorrow."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L1-04", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 1, "levelName": "ง่าย", "question": "He ______ like spicy food.", "choices": ["don't", "isn't", "aren't", "doesn't"], "answer": 3, "hint": "ปฏิเสธ Present simple กับ He", "explanation": ["He + doesn't + V1", "He doesn't like spicy food."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L1-05", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 1, "levelName": "ง่าย", "question": "We ______ at home last Sunday.", "choices": ["were", "is", "are", "was"], "answer": 0, "hint": "last Sunday = อดีต ประธาน We", "explanation": ["Past ของ are คือ were", "We were at home last Sunday."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L2-01", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 2, "levelName": "กลาง", "question": "‘What ______ your father do?’ ‘He is a farmer.’", "choices": ["does", "do", "did he", "is"], "answer": 0, "hint": "ถามอาชีพด้วย What … do?", "explanation": ["ประธาน your father เอกพจน์", "ใช้ does: What does your father do?"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L2-02", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 2, "levelName": "กลาง", "question": "Mali usually ______ breakfast at 7 o'clock, but today she ______ breakfast at 8.", "choices": ["has / had", "have / has", "had / have", "has / have"], "answer": 0, "hint": "usually = เป็นประจำ ส่วน today ในประโยคนี้เป็นเรื่องที่เกิดขึ้นแล้ว", "explanation": ["usually ใช้ Present simple: has", "วันนี้กินไปแล้วตอน 8 โมง ใช้ Past simple: had"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L2-03", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 2, "levelName": "กลาง", "question": "Choose the correct sentence.", "choices": ["She is reading a book now.", "She are reading a book now.", "She reading a book now.", "She is read a book now."], "answer": 0, "hint": "Present continuous ต้องมี is/am/are + V-ing", "explanation": ["She ใช้ is", "is + reading ถูกต้อง"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L2-04", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 2, "levelName": "กลาง", "question": "The past form of ‘buy’ is ______.", "choices": ["brought", "buys", "buyed", "bought"], "answer": 3, "hint": "buy เป็นกริยาไม่ปกติ", "explanation": ["buy → bought", "brought เป็นอดีตของ bring"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L2-05", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.1", "topic": "2.1 Tenses กาลของกริยา", "level": 2, "levelName": "กลาง", "question": "Listen! Someone ______ the door.", "choices": ["knocking on", "are knocking on", "is knocking on", "knock on"], "answer": 2, "hint": "Listen! = เกิดขึ้นขณะนี้", "explanation": ["ใช้ is + V-ing", "Someone is knocking on the door."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.1-L3-01", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topi ": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.2-L0-04", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.2", "topic": "2.2 คำบุพบท คำสรรพนาม และการเปรียบเทียบ", "level": 0, "levelName": "ตั้งไข่", "question": "This is my sister. ______ name is Fah.", "choices": ["Her", "His", "Their", "She"], "answer": 0, "hint": "sister เป็นผู้หญิง แสดงความเป็นเจ้าของ", "explanation": ["ของเธอ = her", "Her name is Fah."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.2-L0-05", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.2", "topic": "2.2 คำบุพบท คำสรรพนาม และการเปรียบเทียบ", "level": 0, "levelName": "ตั้งไข่", "question": "An elephant is ______ than a dog.", "choices": ["more big", "biggest", "bigger", "big"], "answer": 2, "hint": "than = กว่า", "explanation": ["big → bigger (เพิ่ม g + er)", "An elephant is bigger than a dog."], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.2-L1-01", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.2", "topic": "2.2 คำบุพบท คำสรรพนาม และการเปรียบเทียบ", "level": 1, "levelName": "ง่าย", "question": "My birthday is ______ Monday.", "choices": ["in", "to", "on", "at"], "answer": 2, "hint": "วันในสัปดาห์", "explanation": ["วัน ใช้ on", "on Monday"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"}, {"id": "P6-EN-2.2-L1-02", "subject": "EN", "subjectName": "ภาษาอังกฤษ", "chapterId": "EN-C2", "chapter": "บทที่ 2 Grammar ไวยากรณ์", "topicId": "EN-2.2", "topic": "2.2 คำบุพบท คำสรรพนาม และการเปรียบเทียบ", "level": 1, "levelName": "ง่าย", "question": "Please give the pencil to ______.", "choices": ["me", "mine of", "I", "my"], "answer": 0, "hint": "หลังคำบุพบท to ใช้กรรม", "explanation": ["I → me (กรรม)", "give it to me"], "source": "แต่งตามแนวข้อสอบเข้า ม.1 — ครูตรวจทาน"} function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== โปรไฟล์ผู้เรียน และกลไกปรับระดับ (adaptive engine) ===== */
function newProfile(info){return{info:info||{},log:[],ts:{},seen:{},recent:[],tests:{},active:null,lastTopic:null,rounds:{},practice:[]};}
function tstate(P,tid){return P.ts[tid]||(P.ts[tid]={level:0,recent:[],wrong:0});}
/* เลือกโจทย์: ระดับปัจจุบันของหัวข้อ ไม่ซ้ำข้อที่เพิ่งทำ เน้นข้อที่ยังไม่เคยทำ > ข้อที่เคยผิด > ข้อที่ทำนานที่สุด */
function pickQ(P,tid,rnd){
  rnd=rnd||Math.random;const lv=tstate(P,tid).level;const pool=QBY[tid+"|"+lv]||[];
  const recent=new Set(P.recent.slice(-RULES.noRepeat));
  let cand=pool.filter(q=>!recent.has(q.id));
  if(!cand.length){const last=P.recent[P.recent.length-1];cand=pool.filter(q=>q.id!==last);if(!cand.length)cand=pool.slice();}
  const score=q=>{const s=P.seen[q.id];if(!s)return 0;if(!s.c)return 1;return 2+s.t/1e13;};
  let best=Infinity;cand.forEach(q=>best=Math.min(best,score(q)));
  const top=cand.filter(q=>Math.floor(score(q))===Math.floor(best));
  if(best>=2){top.sort((a,b)=>P.seen[a.id].t-P.seen[b.id].t);return top[0];}
  return top[Math.floor(rnd()*top.length)];
}
/* บันทึกคำตอบ: ถูก 4 ใน 5 ข้อล่าสุดของระดับนั้น -> ขึ้นระดับ, ผิด 2 ข้อติดกัน -> ลงระดับ */
function applyAnswer(P,q,correct,unsure,ts,extra){
  const st=tstate(P,q.topicId),from=st.level;
  const e={q:q.id,t:q.topicId,lv:q.level,c:correct?1:0,u:unsure?1:0,ts:ts};
  if(extra&&extra.choice!=null)e.a=extra.choice;if(extra&&extra.sim)e.sim=1;
  P.log.push(e);P.seen[q.id]={t:ts,c:e.c};P.recent.push(q.id);if(P.recent.length>12)P.recent.shift();P.lastTopic=q.topicId;
  let change=0;
  if(q.level===st.level){st.recent.push(e.c);if(st.recent.length>RULES.upWindow)st.recent.shift();}
  if(correct){st.wrong=0;const ok=st.recent.reduce((a,b)=>a+b,0);
    if(ok>=RULES.upNeed&&st.level<3){st.level++;st.recent=[];change=1;}}
  else{st.wrong++;if(st.wrong>=RULES.downWrong){if(st.level>0){st.level--;change=-1;st.recent=[];}st.wrong=0;}}
  return{change,from,to:st.level};
}
/* ความแม่น: ถ่วงน้ำหนักข้อใหม่มากกว่า (0.9^ลำดับความเก่า) × ความเพียงพอของจำนวนข้อ min(1,n/5) */
function statsAll(P,opt){
  opt=opt||{};let log=P.log;
  if(opt.before)log=log.filter(e=>e.ts<opt.before);
  if(opt.dropLast)log=log.slice(0,Math.max(0,log.length-opt.dropLast));
  const S={};TOPICS.forEach(t=>S[t.id]={n:0,c:0,w:0,wc:0,u:0,lv:[[0,0],[0,0],[0,0],[0,0]],k:0});
  for(let i=log.length-1;i>=0;i--){const e=log[i],s=S[e.t];if(!s)continue;const w=Math.pow(0.9,s.k++);
    s.n++;s.c+=e.c;s.w+=w;s.wc+=w*e.c;s.u+=e.u||0;s.lv[e.lv][1]++;s.lv[e.lv][0]+=e.c;}
  TOPICS.forEach(t=>{const s=S[t.id];s.acc=s.w?s.wc/s.w:0;s.m=Math.round(s.acc*Math.min(1,s.n/5)*100);});
  return S;
}
function groupM(S,tids){let m=0,n=0,c=0,u=0;const lv=[[0,0],[0,0],[0,0],[0,0]];
  tids.forEach(t=>{const s=S[t];m+=s.m;n+=s.n;c+=s.c;u+=s.u;s.lv.forEach((x,i)=>{lv[i][0]+=x[0];lv[i][1]+=x[1];});});
  return{m:Math.round(m/Math.max(1,tids.length)),n,c,u,lv};}
function trendOf(P,tids,now){
  now=now||Date.now();const cur=groupM(statsAll(P),tids).m;
  const old=P.log.filter(e=>e.ts<now-7*DAY&&tids.includes(e.t)).length;
  const base=old?statsAll(P,{before:now-7*DAY}):statsAll(P,{dropLast:5});
  return cur-groupM(base,tids).m;
}

function stars(s){return(s.m>=50?1:0)+(s.m>=75?1:0)+(s.m>=90&&s.n>=10?1:0);}
function topicOpen(S,tid){const t=TOPIC[tid];if(t.idx===0)return true;const prev=CHAP[t.chapterId].topics[t.idx-1].id;return S[prev].n>=RULES.unlockTopicN;}
function weakestTopic(S,tids){let best=null;tids.forEach(t=>{if(!topicOpen(S,t))return;if(!best||S[t].m<S[best].m)best=t;});return best||tids[0];}
function attemptsUsed(P,rid){return(P.tests[rid]||[]).length+(P.active&&P.active.room===rid?1:0);}
/* เงื่อนไขปลดล็อกห้องสอบ: ห้องรายวิชา = ความแม่นเฉลี่ยของวิชา ≥70% · สอบเสมือนจริง = ฝึกครบทุกวิชา วิชาละ ≥10 ข้อ */
function roomState(P,S,rid){const r=ROOM[rid];
  if(r.subject){const m=groupM(S,r.topics).m;return{open:m>=RULES.roomUnlock,prog:Math.min(100,m/RULES.roomUnlock*100),text:"ความแม่นวิชานี้ "+m+"% / "+RULES.roomUnlock+"%"};}
  const ns=SUBJECTS.map(s=>groupM(S,topicsOf(s.id)).n);const ok=ns.filter(n=>n>=RULES.mockNeed).length;
  return{open:ok===SUBJECTS.length,prog:ns.reduce((a,n)=>a+Math.min(n,RULES.mockNeed),0)/(RULES.mockNeed*SUBJECTS.length)*100,text:"ฝึกครบ "+ok+"/"+SUBJECTS.length+" วิชา (วิชาละ ≥"+RULES.mockNeed+" ข้อ)"};}
function streakInfo(P){
  const days=new Set(P.log.filter(e=>!e.sim).map(e=>dkey(e.ts)));const today=dkey(Date.now());
  let n=0,d=Date.now();if(!days.has(today))d-=DAY;while(days.has(dkey(d))){n++;d-=DAY;}
  const todayN=P.log.filter(e=>dkey(e.ts)===today).length;return{streak:n,today:todayN};}

/* ===== ระบบตรวจให้คะแนนอัตโนมัติ (ใช้ร่วมกันทุกวิชา/ทุกแบบ) ===== */
/* ตรวจคำตอบ 1 ข้อ: ปรนัย = เทียบดัชนี · แบบเติมตัวเลข (type:"num") = ปรับรูปแบบแล้วเทียบโดยยอมคลาดเคลื่อน tol */
function normNum(s){s=String(s==null?"":s).trim().replace(/[๐-๙]/g,d=>"๐๑๒๓๔๕๖๗๘๙".indexOf(d)).replace(/[,\s]/g,"").replace(/[^\d.\/\-]/g,"");
  if(!s)return NaN;const f=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(f)return+f[1]/+f[2];return/^-?\d*\.?\d+$/.test(s)?+s:NaN;}
function isCorrect(q,a){if(a==null||a==="")return false;if(q.type==="num"){const x=normNum(a);return!isNaN(x)&&Math.abs(x-q.num)<=(q.tol||1e-9);}return+a===q.answer;}
function gradeSet(qids,ans){const per={},perS={};let c=0;
  qids.forEach(id=>{const q=QID[id];const ok=isCorrect(q,ans[id])?1:0;c+=ok;(per[q.topicId]=per[q.topicId]||[0,0]);per[q.topicId][0]+=ok;per[q.topicId][1]++;
    (perS[q.subject]=perS[q.subject]||[0,0]);perS[q.subject][0]+=ok;perS[q.subject][1]++;});
  const n=qids.length,pct=n?Math.round(c/n*100):0;return{correct:c,n,pct,pass:pct>=RULES.pass,per,perS};}

const SIM_SCHOOLS=["โรงเรียนตัวอย่างดอยดาว (สมมติ)","โรงเรียนตัวอย่างห้วยใส (สมมติ)","โรงเรียนตัวอย่างทุ่งทอง (สมมติ)","โรงเรียนตัวอย่างบ้านฝัน (สมมติ)","โรงเรียนตัวอย่างน้ำใส (สมมติ)","โรงเรียนตัวอย่างป่าสัก (สมมติ)"];

const SIMSTU=[];(function(){const r=mulberry32(hashStr("xgym-p6-sim"));const now=Date.now();
  for(let i=0;i<72;i++){const sch=SIM_SCHOOLS[i%6===5&&r()<.5?0:Math.floor(Math.pow(r(),1.4)*6)];
    SIMSTU.push({rid:"SIM-"+String(i+1).padStart(3,"0"),fullName:SIM_FIRST[i%24]+" "+SIM_LAST[Math.floor(i/12)%6],nick:SIM_NICK[(i*7)%24],grade:i%9===0?"ป.5":"ป.6",school:sch,
      regTs:now-Math.floor(r()*21)*DAY-Math.round(r()*DAY*.6),sim:1});}})();
const TDIFF={"MA":.35,"SC":.1,"EN":.2,"TH":0,"SO":.05};
const SIM={};
function simulate(st){
  const r=mulberry32(hashStr("p6-"+st.rid));const ab=gauss(r)*.85+(st.grade==="ป.5"?-.3:0);const P=newProfile(st);const now=Date.now();
  const start=Math.max(st.regTs,now-20*DAY),span=Math.max(DAY,now-start-DAY*.2);
  SUBJECTS.forEach(s=>{if(r()<.18)return;const sab=ab+gauss(r)*.45;let stop=false;const plan=[];
    s.chapters.forEach((c,ci)=>c.topics.forEach(t=>{if(stop)return;let k=Math.round(4+r()*14+sab*3-ci*2);k=clamp(k,0,22);for(let i=0;i<k;i++)plan.push(t.id);if(k<RULES.unlockTopicN)stop=true;}));
    plan.forEach((tid,i)=>{const q=pickQ(P,tid,r);const prog=i/Math.max(1,plan.length);
      const p=1/(1+Math.exp(-(1.2*sab+.5*prog+1.5-.8*q.level-(TDIFF[s.id]||0))));const c=r()<p;
      applyAnswer(P,q,c,r()<(c?.07:.28),Math.round(start+span*(prog*.85+r()*.15)),{sim:1});});
    const tc={};plan.forEach(t=>tc[t]=(tc[t]||0)+1);Object.keys(tc).forEach(t=>P.rounds[t]=Math.ceil(tc[t]/RULES.round));});
  const S=statsAll(P);
  ROOMS.forEach(room=>{const rs=roomState(P,S,room.id);if(!rs.open)return;const m=groupM(S,room.topics).m;const k=1+Math.floor(r()*3);P.tests[room.id]=[];
    const N=room.subject?RULES.testN:RULES.mockPer*SUBJECTS.length;
    for(let i=0;i<k;i++){const pct=clamp(Math.round(m-10+i*4+gauss(r)*9),15,100);let correct=Math.round(pct/100*N);
      const perS={};if(!room.subject){correct=0;SUBJECTS.forEach(s=>{const sm=groupM(S,topicsOf(s.id)).m;const c=clamp(Math.round((sm-8+i*4+gauss(r)*12)/100*RULES.mockPer),0,RULES.mockPer);perS[s.id]=[c,RULES.mockPer];correct+=c;});}const p2=Math.round(correct/N*100);
      P.tests[room.id].push({ts:now-(k-i)*2*DAY-Math.round(r()*DAY),n:N,correct,pct:p2,pass:p2>=RULES.pass,sim:1,perS,used:Math.round((room.subject?RULES.testMin:RULES.mockMin)*60*(.55+r()*.4))});}});
  return P;
}

function afterRound(){const P=me();if(!QS.sent){QS.sent=1;const qids=QS.items.map(x=>x.id),ans={};QS.items.forEach(x=>ans[x.id]=x.a);
    const g=gradeSet(qids,ans);const subj=QID[qids[0]].subject;
    const rec={ts:Date.now(),mode:QS.mode,target:QS.target,subject:subj,qids,ans,correct:g.correct,n:g.n,pct:g.pct,pass:g.pass,per:g.per,used:Math.round((Date.now()-QS.start)/1000)};
    Object.keys(g.per).forEach(t=>P.rounds[t]=(P.rounds[t]||0)+1);rec.attempt={};Object.keys(g.per).forEach(t=>rec.attempt[t]=P.rounds[t]);
    P.practice.push(rec);if(P.practice.length>150)P.practice.shift();saveDB();queuePracticeRound(rec);QS.rec=P.practice.length-1;}

function pickMix(tids,mix,used){const out=[];let ti=Math.floor(Math.random()*tids.length);
  mix.forEach((k,lv)=>{let tries=0,got=0;while(got<k&&tries<300){tries++;const tid=tids[ti%tids.length];ti++;
    const pool=(QBY[tid+"|"+lv]||[]).filter(q=>!used.has(q.id));if(!pool.length)continue;const q=pool[Math.floor(Math.random()*pool.length)];used.add(q.id);out.push(q);got++;}});
  return out;}

  <div class="note">ใช้ประกอบการช่วยเหลือ ไม่ใช่การตัดสินนักเรียน · ใบรายงานผลถึงผู้ปกครองพิมพ์ได้จากแท็บ “ใบรายงานผลรายบุคคล” ใน Google Sheet ของโรงเรียน</div>`,{mid:true});}
function aTools(){const q=sqLoad();const P=me();
  return`<div class="dgrid"><div class="card"><h2>สถานะการส่งข้อมูล</h2><div class="kv"><span>ตัวรับข้อมูล</span><span>${syncReady()?'<span class="syncdot" style="background:#22a55b"></span>ตั้งค่าแล้ว':'<span class="syncdot" style="background:#f08a12"></span>ยังไม่ได้ใส่ลิงก์ (เก็บคิวไว้ในเครื่อง)'}</span><span>รอส่ง</span><span>${q.length} รายการ (ลงทะเบียน ${q.filter(r=>r.kind==="reg").length} · ผล ${q.filter(r=>r.kind==="result").length})</span><span>ส่งล่าสุด</span><span>${localStorage.getItem(SYNC.qkey+"_last")?fmtDate(+localStorage.getItem(SYNC.qkey+"_last")):"–"}</span></div>
   <button class="btn ghost sm" style="margin-top:10px" data-act="syncNow">ลองส่งตอนนี้</button></div>
  <div class="card"><h2>จำลองความแม่น (สาธิตการปลดล็อกห้องสอบ)</h2><div class="small mut">เพิ่มคำตอบจำลอง (ติดป้าย sim · ไม่ส่งเข้าชีต) ให้ผู้เรียนที่ใช้อยู่ในเครื่องนี้</div>
   ${P?`<div class="row wrapx" style="margin-top:10px"><select id="seedSub" style="min-height:44px;border-radius:12px;padding:0 10px">${SUBJECTS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}<option value="ALL">ทุกวิชา</option></select><button class="btn sm" data-act="seed">จำลองให้ น้อง${esc(P.info.nick)}</button></div>`:'<div class="small" style="margin-top:8px">ยังไม่มีผู้เรียนที่ใช้งานอยู่</div>'}</div>
  <div class="card"><h2>ไฟล์</h2><div class="row wrapx"><button class="btn ghost sm" data-act="dlBank">ดาวน์โหลดคลังโจทย์ (JSON)</button><button class="btn light sm" data-act="source">แหล่งข้อมูล</button></div>
   <div class="small" style="margin-top:10px">คลังโจทย์ ${QUESTION_BANK.length} ข้อ · ${SUBJECTS.length} วิชา · ${TOPICS.length} หัวข้อ × 4 ระดับ</div>
   <div class="small mut">${SUBJECTS.map(s=>esc(s.name)+" "+QUESTION_BANK.filter(q=>q.subject===s.id).length).join(" · ")}</div></div></div>`;}
function seedMastery(sid){const P=me();if(!P)return 0;const pat=[1,1,1,1,0,1,1,1];let ts=Date.now()-3*3600e3;const tids=sid==="ALL"?allTids():topicsOf(sid);
  tids.forEach(tid=>{pat.forEach(c=>{const q=pickQ(P,tid);applyAnswer(P,q,!!c,false,ts,{choice:c?q.answer:(q.answer+1)%4,sim:1});ts+=20e3;});});saveDB();
  return groupM(statsAll(P),tids).m;}
function download(name,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}));a.download=name;a.click();}

/* ===== ส่งข้อมูลเข้า Google Sheet ส่วนตัวของโรงเรียน (คิวออฟไลน์ + ส่งซ้ำ) =====
   ใส่ลิงก์เว็บแอป Apps Script (https://script.google.com/macros/s/.../exec) แทน RECEIVER_URL
   ถ้ายังไม่ใส่ แอปยังใช้ได้ปกติ และเก็บคิวไว้ในเครื่องจนกว่าจะมีลิงก์ */
const SYNC={url:"RECEIVER_URL",key:"kruom-piyamit-p6",batch:50,max:2000,qkey:STORE_KEY+"_sendQueue"};
let syncBusy=false;
function syncReady(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(SYNC.url);}
function sqLoad(){try{return JSON.parse(localStorage.getItem(SYNC.qkey)||"[]");}catch(e){return[];}}
function sqSave(q){try{/* เกินเพดาน: ตัดผลเก่าสุดก่อน แต่เก็บแถวลงทะเบียนไว้ */
  while(q.length>SYNC.max){const i=q.findIndex(r=>r.kind!=="reg");q.splice(i<0?0:i,1);}
  localStorage.setItem(SYNC.qkey,JSON.stringify(q));}catch(e){}}
function sqPush(rows){if(!rows.length)return;const q=sqLoad();rows.forEach(r=>q.push(r));sqSave(q);syncFlush();}
function eidOf(rid,tag){return"P6-"+rid+"-"+Date.now().toString(36)+"-"+tag+"-"+Math.random().toString(36).slice(2,7);}
function srcTag(){try{return(new URLSearchParams(location.search).get("src")||"").replace(/[^A-Za-z0-9_\-]/g,"").slice(0,20);}catch(e){return"";}}
function queueRegistration(info,contact){
  sqPush([{kind:"reg",eid:eidOf(info.rid,"r"),ts:info.regTs,rid:info.rid,fullName:info.fullName,nick:info.nick,grade:info.grade,school:info.school,
    parent:contact.parent,phone:contact.phone,line:contact.line,email:contact.email,consent:contact.consent?1:0,hof:info.hof?1:0,src:srcTag()}]);}
function resBase(){const P=me();if(!P)return null;const i=P.info;return{kind:"result",rid:i.rid,nick:i.nick,school:i.school,grade:i.grade,passPct:RULES.pass};}
/* หลังจบรอบฝึก: 1 แถวต่อหัวข้อในรอบ */
function queuePracticeRound(rec){const b=resBase();if(!b)return;const P=me(),S=statsAll(P);
  sqPush(Object.keys(rec.per).map((tid,i)=>{const t=TOPIC[tid],x=rec.per[tid];
    return Object.assign({},b,{eid:eidOf(b.rid,"p"+i),ts:rec.ts,subject:SUBJ[t.subject].name,topic:tlabel(tid),type:"ฝึก",level:LV[tstate(P,tid).level],
      correct:x[0],total:x[1],pass:x[0]/x[1]*100>=RULES.pass?1:0,used:Math.round(rec.used*x[1]/rec.n),attempt:rec.attempt[tid],mastery:S[tid].m,exam:""});}));}
/* หลังส่งข้อสอบ: ห้องรายวิชา = 1 แถว · สอบเสมือนจริง = 1 แถวรวม + 1 แถวต่อวิชา */
function queueTest(rid,rec,attempt){const b=resBase();if(!b)return;const R=ROOM[rid];
  const rows=[Object.assign({},b,{eid:eidOf(b.rid,"t"),ts:rec.ts,subject:R.subject?SUBJ[R.subject].name:"รวม 5 วิชา",topic:"",type:R.subject?"สอบรายวิชา":"สอบเสมือนจริง",level:"คละระดับ",
    correct:rec.correct,total:rec.n,pass:rec.pass?1:0,used:rec.used,attempt,mastery:"",exam:R.name})];
  if(!R.subject)SUBJECTS.forEach((s,i)=>{const x=rec.perS[s.id]||[0,0];if(!x[1])return;
    rows.push(Object.assign({},b,{eid:eidOf(b.rid,"m"+i),ts:rec.ts,subject:s.name,topic:"",type:"สอบเสมือนจริง (รายวิชา)",level:"คละระดับ",
      correct:x[0],total:x[1],pass:x[0]/x[1]*100>=RULES.pass?1:0,used:"",attempt,mastery:"",exam:R.name}));});
  sqPush(rows);}
async function syncFlush(){
  if(syncBusy||!syncReady()||(navigator.onLine===false))return;
  syncBusy=true;
  try{
    for(let guard=0;guard<40;guard++){
      const q=sqLoad();if(!q.length)break;
      const part=q.slice(0,SYNC.batch);
      await fetch(SYNC.url,{method:"POST",mode:"no-cors",keepalive:part.length<=20,body:JSON.stringify({key:SYNC.key,rows:part})}); /* ออฟไลน์ → throw → คิวยังอยู่ */
      const ids=new Set(part.map(r=>r.eid));sqSave(sqLoad().filter(r=>!ids.has(r.eid)));localStorage.setItem(SYNC.qkey+"_last",String(Date.now()));
    }
  }catch(e){/* เน็ตหลุด: เก็บไว้ส่งรอบหน้า */}
  finally{syncBusy=false;}
}
window.addEventListener("online",syncFlush);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncFlush();});
setInterval(syncFlush,60000);
setTimeout(syncFlush,1500);

/* ===== ตัวจัดการเหตุการณ์ ===== */
document.addEventListener("click",e=>{const el=e.target.closest("[data-go],[data-act],[data-login],[data-ch],[data-pick],[data-tq],[data-tans],[data-tutor],[data-tab],[data-asub],[data-stu],[data-sort]");if(!el||el.disabled)return;const d=el.dataset;
  if(d.go){if(d.go.startsWith("ch:"))return go("chapter",{ch:d.go.slice(3)});if(d.go.startsWith("subj:"))return go("subject",{s:d.go.slice(5)});if(d.go==="admin")return go("admin",{tab:"overview"});return go(d.go);}
  if(d.login){if(DB.profiles[d.login]){DB.current=d.login;saveDB();const P=me();return go(P.active?"test":"home");}return;}
  if(d.ch&&!d.act)return go("chapter",{ch:d.ch});
  if(d.pick!=null&&QS&&!QS.checked){QS.sel=+d.pick;return render();}
  if(d.tq!=null){me().active.cur=+d.tq;saveDB();return render();}
  if(d.tans!=null){const A=me().active;A.ans[A.qids[A.cur]]=+d.tans;saveDB();return render();}
  if(d.tutor)return showTutor(QS.q,d.tutor);
  if(d.tab){UI.p.tab=d.tab;return render();}
  if(d.asub){UI.p.s=d.asub;return render();}
  if(d.stu)return showStudent(d.stu);
  if(d.sort){if(UI.p.sort===d.sort)UI.p.dir=-(UI.p.dir||1);else{UI.p.sort=d.sort;UI.p.dir=(d.sort==="name"||d.sort==="school")?1:-1;}return render();}
  const a=d.act;
  if(a==="register")return doRegister();
  if(a==="logout"){DB.current=null;saveDB();QS=null;return go("register");}
  if(a==="deleteMe"){const P=me();if(!P)return;if(!confirm("ลบข้อมูลของน้อง"+P.info.nick+" (ความคืบหน้า ผลคะแนน และข้อมูลที่ยังรอส่ง) ออกจากเครื่องนี้?"))return;

  if(a==="practice")return startPractice("topic",d.t);
  if(a==="practiceCh")return startPractice("chapter",d.ch);
  if(a==="mastery")return go("mastery",{k:d.k,id:d.id});
  if(a==="help")return showHelp();
  if(a==="source")return showSource();
  if(a==="unsure"){QS.unsure=!QS.unsure;return render();}
  if(a==="hint")return showHint(QS.q);
  if(a==="explain")return showExplain(QS.q);
  if(a==="tutor")return showTutor(QS.q,null);
  if(a==="check")return doCheck();
  if(a==="next"){if(QS.done>=RULES.round)return afterRound();return nextQ();}
  if(a==="quitQuiz"){const t=QS.q.topicId;if(QS.done&&!confirm("ออกกลางรอบ? ข้อที่ทำแล้วยังนับในความแม่น แต่จะไม่มีผลคะแนนรอบนี้"))return;QS=null;return go("chapter",{ch:TOPIC[t].chapterId});}
  if(a==="again"){const p=UI.p;if(p.k==="topic")return startPractice("topic",p.id);if(p.k==="chapter")return startPractice("chapter",p.id);const S=statsAll(me());return startPractice("topic",weakestTopic(S,scopeTids(p.k,p.id)));}
  if(a==="openRound"){const r=me().practice[+d.i];return go("mastery",{k:r.mode==="topic"?"topic":"chapter",id:r.target,rec:+d.i});}
  if(a==="openTest")return go("result",{r:d.r,i:+d.i});
  if(a==="startTest")return startTest(d.r);
  if(a==="confirmTest")return confirmTest(d.r);
  if(a==="resumeTest")return go("test");
  if(a==="tprev"){me().active.cur--;saveDB();return render();}
  if(a==="tnext"){me().active.cur++;saveDB();return render();}
  if(a==="tsubmit"){const A=me().active;const left=A.qids.length-Object.keys(A.ans).length;if(left&&!confirm("ยังไม่ได้ตอบ "+left+" ข้อ ต้องการส่งเลยหรือไม่?"))return;return submitTest(false);}
  if(a==="history"){const P=me();return sheet(`<h2>ประวัติ · ${esc(ROOM[d.r].name)}</h2>${histHtml(P.tests[d.r]||[])}<button class="btn block" data-close="1">ปิด</button>`);}
  if(a==="seed"){const sid=document.getElementById("seedSub").value;const m=seedMastery(sid);CALC=null;toast("จำลองแล้ว: ความแม่น "+m+"%");return render();}
  if(a==="syncNow"){if(!syncReady())return toast("ยังไม่ได้ใส่ลิงก์ตัวรับข้อมูล ข้อมูลยังเก็บอยู่ในเครื่อง");syncFlush().then(()=>{toast("ส่งแล้ว");render();});return;}
  if(a==="dlBank")return download("kruom_xexamgym_p6_question_bank.json",QUESTION_BANK);
});
document.addEventListener("input",e=>{if(e.target.id==="q"){UI.p.q=e.target.value;document.getElementById("tb").innerHTML=stuRowsHtml(calcAll());}
  if(e.target.id&&e.target.id.startsWith("r_")){const f=e.target.closest(".field,.check");if(f)f.classList.remove("err");}});
document.addEventListener("change",e=>{if(e.target.id==="schSel"){UI.p.sch=e.target.value;render();}
  if(e.target.id==="r_consent"){const f=e.target.closest(".check");if(f)f.classList.remove("err");}});

/* ===== render ===== */
function render(){const s=UI.screen;document.body.classList.toggle("wide",s==="admin");
  const needMe=["home","subject","chapter","quiz","mastery","review","rooms","test","result","results"];
  if(needMe.includes(s)&&!me()){UI={screen:"register",p:{}};}
  if(UI.screen==="quiz"&&!QS){UI={screen:"home",p:{}};}
  const f={register:scrRegister,home:scrHome,subject:scrSubject,chapter:scrChapter,quiz:scrQuiz,mastery:scrMastery,review:scrReview,results:scrResults,rooms:scrRooms,test:scrTest,result:scrResult,admin:scrAdmin,sponsor:scrSponsor,privacy:scrPrivacy}[UI.screen]||scrRegister;
  $app.innerHTML=f();}
setInterval(tick,1000);
UI={screen:me()?(me().active?"test":"home"):"register",p:{}};render();
/* ตัวช่วยสำหรับการทดสอบอัตโนมัติ */
window.__EG={DB:()=>DB,me,statsAll,groupM,RULES,QUESTION_BANK,QID,go,seedMastery,startPractice,gradeSet,isCorrect,normNum,sqLoad,SYNC,roomState,
  fastForward:s=>{const P=me();if(P&&P.active){P.active.start-=s*1000;saveDB();tick();}},cur:()=>QS&&QS.q,ui:()=>UI};

   <div class="cell"><i class="xic c4">📝<\/i><span>ห้องสอบวิชา: แม่น ≥${RULES.roomUnlock}% · ${RULES.testN} ข้อ ${RULES.testMin} นาที · ${RULES.maxAttempts} ครั้ง<\/span><\/div>
   <div class="cell"><i class="xic">🏁<\/i><span>${MOCKN}: ${RULES.mockPer*SUBJECTS.length} ข้อ ${RULES.mockMin} นาที · ฝึกทุกวิชา วิชาละ ≥${RULES.mockNeed} ข้อ · ${RULES.maxAttempts} ครั้ง<\/span><\/div><\/div>
  <div class="row wrapx" style="gap:6px">${LV.map((l,i)=>`<span class="pill lv${i}">${l}<\/span>`).join("")}<\/div><button class="btn pri block" data-close="1" style="margin-top:14px">ปิด<\/button>`);};

/* ---------- ห้องสอบ ---------- */
scrRooms=function(){const P=me(),S=statsAll(P);
  return`${nav("ห้องสอบ","home")}
  <div class="chips" style="margin:-4px 0 12px"><span class="xchip">✓ ตรวจทันที<\/span><span class="xchip">เกณฑ์ ${RULES.pass}%<\/span><span class="xchip">↺ ${RULES.maxAttempts} ครั้ง<\/span><span class="xchip">💡 ✗<\/span><\/div>
  ${ROOMS.map(r=>{const rs=roomState(P,S,r.id),used=attemptsUsed(P,r.id),left=RULES.maxAttempts-used;const H=P.tests[r.id]||[];const best=H.length?Math.max(...H.map(h=>h.pct)):null;
   const act=P.active&&P.active.room===r.id;const m=r.subject?groupM(S,r.topics).m:0;
   const mockOk=SUBJECTS.filter(s=>groupM(S,topicsOf(s.id)).n>=RULES.mockNeed).length;
   return`<div class="room ${rs.open?"":"lock"}"><div class="row" style="flex-wrap:nowrap"><span class="ic lg">${rs.open?roomIc(r.id):"🔒"}<\/span><div class="grow"><b>${esc(roomName(r.id))}<\/b>
   <div class="chips" style="margin-top:4px"><span class="xchip">✎ ${r.subject?RULES.testN:RULES.mockPer*SUBJECTS.length}<\/span><span class="xchip">⏱ ${roomMin(r.id)}′<\/span><span class="xchip">↺ ${left}<\/span>${best!=null?`<span class="xchip ${okc(best)}">★ ${best}%<\/span>`:""}<\/div><\/div><\/div>
   ${rs.open?"":`<div class="row small" style="margin-top:10px"><div class="grow">${bar(rs.prog)}<\/div><span>${r.subject?m+"/"+RULES.roomUnlock+"%":mockOk+"/"+SUBJECTS.length}<\/span><\/div>`}
   <div class="row" style="margin-top:10px;justify-content:flex-end">${H.length?`<button class="btn sm" data-act="history" data-r="${r.id}">🕘 ${H.length}<\/button>`:""}
   ${act?`<button class="btn sm pri" data-act="resumeTest">▶ ทำต่อ<\/button>`:rs.open&&left>0?`<button class="btn sm pri" data-act="startTest" data-r="${r.id}">▶ เริ่ม<\/button>`:rs.open?`<span class="xchip">ครบ ${RULES.maxAttempts} ครั้ง<\/span>`:""}<\/div><\/div>`;}).join("")}`;};
const _startTest=startTest;
startTest=function(rid){_startTest(rid);const btn=document.querySelector('#layer [data-act="confirmTest"]');if(!btn)return;const P=me(),r=ROOM[rid];const mix=r.subject?RULES.mix:RULES.mockMix;
  document.querySelector("#layer .sheet").innerHTML=`<div class="grab"><\/div><h2>${roomIc(rid)} ${esc(roomName(rid))}<\/h2>
  <div class="group"><div class="cell"><i class="xic">${r.subject?RULES.testN:RULES.mockPer*SUBJECTS.length}<\/i><span>ข้อ${r.subject?"":" (วิชาละ "+RULES.mockPer+")"} · ${LV.map((l,i)=>l+" "+mix[i]).join(" · ")}<\/span><\/div>
  <div class="cell"><i class="xic c4">${roomMin(rid)}′<\/i><span>หมดเวลา = ส่งอัตโนมัติ<\/span><\/div>
  <div class="cell"><i class="xic c2">↺ ${RULES.maxAttempts-attemptsUsed(P,rid)}<\/i><span>ครั้งที่เหลือ · กดเริ่ม = นับ 1 ครั้ง<\/span><\/div><\/div>
  <button class="btn pri block big" data-act="confirmTest" data-r="${rid}">▶ เริ่ม<\/button><button class="btn block" data-close="1" style="margin-top:8px">ยังก่อน<\/button>`;};
scrTest=function(){const P=me(),A=P.active;if(!A)return scrRooms();const q=QID[A.qids[A.cur]];const rem=remaining(P);const done=Object.keys(A.ans).length;
  return`<div class="qhead"><div class="row" style="flex-wrap:nowrap"><div class="grow"><b>${roomIc(A.room)} ${esc(roomName(A.room))}<\/b><div class="qcount">✓ ${done}/${A.qids.length}<\/div><\/div><span class="timer ${rem<300?"warn":""}" id="timer">⏱ ${fmtT(rem)}<\/span><\/div><\/div>
  <div class="card" style="padding:12px"><div class="qnav">${A.qids.map((id,i)=>`<button class="${i===A.cur?"cur":A.ans[id]!=null?"a":""}" data-tq="${i}">${i+1}<\/button>`).join("")}<\/div><\/div>
  <div class="qcard"><div class="row wrapx" style="gap:6px"><span class="xchip">ข้อ ${A.cur+1}/${A.qids.length}<\/span>${lvPill(q.level)}<span class="xchip">${SUBJ[q.subject].icon} ${esc(TOPIC[q.topicId].code)}<\/span><\/div><div class="qtext">${esc(q.question)}<\/div><\/div>
  ${q.choices.map((c,i)=>`<button class="choice ${A.ans[q.id]===i?"sel":""}" data-tans="${i}"><span class="k">${KEYS[i]}<\/span><span>${esc(c)}<\/span><\/button>`).join("")}
  <div class="row" style="justify-content:center;margin-top:6px"><button class="btn sm" data-act="tsubmit">✓ ส่งทั้งหมด<\/button><\/div>
  <div class="actionbar"><div class="in"><button class="btn" data-act="tprev" ${A.cur===0?"disabled":""}>‹ ก่อน<\/button>
  ${A.cur<A.qids.length-1?`<button class="btn pri grow" data-act="tnext">ต่อไป ›<\/button>`:`<button class="btn pri grow" data-act="tsubmit">✓ ส่ง<\/button>`}<\/div><\/div>`;};
scrResult=function(){const P=me(),rid=UI.p.r,H=P.tests[rid]||[],rec=H[UI.p.i];if(!rec)return scrRooms();const r=ROOM[rid];
  const subjBlock=!r.subject&&rec.perS?`<div class="gh">รายวิชา<\/div><div class="group">${SUBJECTS.map(s=>{const x=rec.perS[s.id]||[0,0];const p=x[1]?Math.round(x[0]/x[1]*100):0;
    return`<div class="hbar"><span class="lab">${s.icon} ${esc(s.name)}<\/span>${bar(p,p>=RULES.pass?"ok":"")}<b class="small" style="width:86px;text-align:right;color:${p>=RULES.pass?"var(--green-t)":"var(--red-t)"}">${p>=RULES.pass?"✓":"✗"} ${x[0]}/${x[1]}<\/b><\/div>`;}).join("")}<\/div>`:"";
  return`${nav("ผลสอบ","rooms")}${gradeCard(rec,roomIc(rid)+" "+esc(roomName(rid))+" · #"+(UI.p.i+1),(rec.auto?`<span class="xchip warn">⏱ หมดเวลา · ส่งอัตโนมัติ<\/span>`:"")+`<span class="xchip">↺ เหลือ ${RULES.maxAttempts-attemptsUsed(P,rid)}<\/span>`)}
  ${xlSwitch()}${subjBlock}${rec.per?perTopicHtml(rec.per,"รายหัวข้อ"):""}
  ${histHtml(H)}${rec.qids?answersHtml(rec.qids,rec.ans,false):""}
  <button class="btn block" data-go="rooms">‹ ห้องสอบ<\/button>`;};
histHtml=function(H){return`<div class="gh">🕘 ประวัติ<\/div><div class="group">${H.map((h,i)=>`<div class="cell"><span class="num">${i+1}<\/span><span class="t"><small>${fmtDate(h.ts)}<\/small><\/span><span class="r" style="color:${h.pass?"var(--green-t)":"var(--red-t)"}">${h.pass?"✓":"✗"} ${h.pct}% <small class="mut" style="font-weight:400">${h.correct}/${h.n}<\/small><\/span><\/div>`).join("")}<\/div>`;};

/* ---------- ผู้สนับสนุน / ความเป็นส่วนตัว ---------- */
scrSponsor=function(){const back=me()?"home":"register";return`${nav("ผู้สนับสนุน",back)}
  <div class="card" style="text-align:center"><div class="land-logo" style="margin:4px auto 12px">${LOGO}<\/div><b style="font-size:1.15rem">${esc(CURRICULUM.sponsor)}<\/b><div class="mut small">${esc(CURRICULUM.section)} · ${esc(CURRICULUM.location)}<\/div><\/div>
  <div class="group"><div class="cell"><i class="xic">ฟรี<\/i><span>นักเรียน ป.6 ทุกโรงเรียน<\/span><\/div><div class="cell"><i class="xic c2">5<\/i><span>วิชา · ${QUESTION_BANK.length} ข้อ<\/span><\/div><div class="cell"><i class="xic c3">✓<\/i><span>ตรวจทันที พร้อมเฉลย<\/span><\/div><div class="cell"><i class="xic c4">🏠<\/i><span>ฝึกได้ทั้งที่บ้านและในห้องเรียน<\/span><\/div><\/div>
  <div class="gfoot">โจทย์แต่งใหม่ตามหลักสูตรแกนกลางฯ อยู่ระหว่างครูตรวจทาน · ข่าวรับสมัคร: ช่องทางทางการของโรงเรียน<\/div>
  <button class="btn pri block" style="margin-top:14px" data-go="${back}">${me()?"‹ หน้าหลัก":"ลงทะเบียน"}<\/button>`;};
scrPrivacy=function(){const P=me();const q=sqLoad();const mine=P?q.filter(r=>r.rid===P.info.rid).length:0;
  return`${nav("ความเป็นส่วนตัว",P?"home":"register")}
  <div class="gh">เก็บ<\/div><div class="group ab-p"><div class="cell"><b>นักเรียน<\/b><span>ชื่อ-นามสกุล ชื่อเล่น ชั้น โรงเรียน<\/span><\/div><div class="cell"><b>ผู้ปกครอง<\/b><span>ชื่อ และเบอร์โทร/LINE ID/อีเมล (อย่างน้อย 1 ช่องทาง)<\/span><\/div><div class="cell"><b>ผลฝึก<\/b><span>คะแนน ร้อยละ เวลาที่ใช้ หัวข้อ<\/span><\/div><div class="cell"><b>ไม่เก็บ<\/b><span>เลขประจำตัวประชาชน ข้อมูลบัญชีธนาคาร รหัสผ่าน<\/span><\/div><\/div>
  <div class="gh">ไปที่ไหน<\/div><div class="group ab-p"><div class="cell"><b>เครื่องนี้<\/b><span>เบราว์เซอร์ เพื่อจำความคืบหน้า<\/span><\/div><div class="cell"><b>โรงเรียน<\/b><span>ตารางข้อมูลส่วนตัว (Google Sheet) ของ${esc(CURRICULUM.sponsor)} เปิดดูได้เฉพาะผู้ดูแลของโรงเรียน<\/span><\/div><div class="cell"><b>ไม่แสดง<\/b><span>ข้อมูลติดต่อผู้ปกครองไม่แสดงบนหน้าเว็บ ไม่แสดงในกระดานคะแนน และไม่ส่งต่อให้ผู้อื่น<\/span><\/div><div class="cell"><b>ทำเนียบ<\/b><span>“ทำเนียบคนขยัน” (ถ้ามี) แสดงเฉพาะชื่อเล่น + โรงเรียน ของผู้ที่ยินยอม<\/span><\/div><\/div>
  ${P?`<div class="gh">น้อง${esc(P.info.nick)}<\/div><div class="card"><div class="kv"><span>รหัส<\/span><span class="regid">${esc(P.info.rid)}<\/span><span>ชื่อ<\/span><span>${esc(P.info.fullName)}<\/span><span>โรงเรียน<\/span><span>${esc(P.info.school)}<\/span><span>ทำเนียบ<\/span><span>${P.info.hof?"ยินยอม":"ไม่แสดง"}<\/span><span>รอส่ง<\/span><span>${mine}<\/span><\/div>
  <div class="small mut" style="margin-top:8px">ข้อมูลติดต่อผู้ปกครองไม่ได้เก็บไว้แสดงในแอป (อยู่ในคิวรอส่งเท่านั้น และลบออกเมื่อส่งแล้ว)<\/div><\/div>
  <button class="btn red block" data-act="deleteMe">🗑 ลบข้อมูลของฉันออกจากเครื่องนี้<\/button>
  <div class="gfoot">ลบข้อมูลที่ส่งถึงโรงเรียนแล้ว: ผู้ปกครองแจ้งรหัสผู้เรียนกับ${esc(CURRICULUM.sponsor)}ผ่านช่องทางทางการของโรงเรียน<\/div>`:""}`;};

/* ---------- แถบแท็บล่าง ---------- */
const TB=document.createElement("nav");TB.className="tabbar";TB.setAttribute("aria-label","เมนูหลัก");TB.hidden=true;document.body.appendChild(TB);
const TABS=[["home","วิชา",'<path d="M4 13.2 14 4.5l10 8.7V23a1.5 1.5 0 0 1-1.5 1.5H17v-7h-6v7H5.5A1.5 1.5 0 0 1 4 23z" fill="currentColor"/>'],
 ["rooms","ห้องสอบ",'<circle cx="14" cy="15.5" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14 10v6l3.5 2.5M11 3.5h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'],
 ["results","ผล",'<path d="M5 23.5V15M11.3 23.5V9M17.6 23.5V12.5M24 23.5V5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'],
 ["review","ทบทวน",'<circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10.6 11a3.5 3.5 0 1 1 4.6 3.3c-.8.3-1.2 1-1.2 1.8v.6M14 20.2v.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>']];
const TAB_OF={home:"home",subject:"home",chapter:"home",rooms:"rooms",result:"rooms",results:"results",review:"review",privacy:"",sponsor:""};
function drawTabs(){const s=UI.screen;const show=me()&&Object.prototype.hasOwnProperty.call(TAB_OF,s);TB.hidden=!show;document.body.classList.toggle("ios-tb",!!show);if(!show)return;
  const un=me().log.filter(e=>e.u).length;
  TB.innerHTML=`<div class="in">${TABS.map(t=>`<button data-go="${t[0]}" class="${TAB_OF[s]===t[0]?"on":""}" aria-label="${t[1]}"><svg viewBox="0 0 28 28" aria-hidden="true">${t[2]}<\/svg>${t[1]}${t[0]==="review"&&un?`<span class="bdg">${un>99?"99+":un}<\/span>`:""}<\/button>`).join("")}<\/div>`;}

/* ---------- render: เพิ่มหน้าแรก + คลาสของหน้า ---------- */
const _render=render;
render=function(){if(UI.screen==="landing"){document.body.classList.remove("wide");$app.innerHTML=scrLanding();}else _render();
  document.body.className=document.body.className.replace(/\bs-\S+/g,"").trim()+" s-"+UI.screen;drawTabs();};
document.addEventListener("click",e=>{const el=e.target.closest("[data-ios]");if(!el)return;const a=el.dataset.ios;
  if(a==="about")return showAbout();
  if(a==="start"){const P=me();return go(P?(P.active?"test":"home"):"register");}
},true);
document.addEventListener("change",e=>{if(e.target.id==="xlSw"){const on=e.target.checked;document.documentElement.classList.toggle("xl",on);try{localStorage.setItem(XLK,on?"1":"0");}catch(x){}}});
try{document.documentElement.classList.toggle("xl",localStorage.getItem(XLK)==="1");}catch(x){}
/* เปิดที่หน้าแรกเสมอ (ข้อสอบที่ค้างอยู่ เวลายังเดินตามเดิม กด "เริ่ม" แล้วกลับไปทำต่อ) */
UI={screen:"landing",p:{}};render();
})();

</script>
</body>
</html>
